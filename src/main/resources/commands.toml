# VaryonUI Commands Configuration
# Each category can have up to 4 buttons per row
# If more than 4 buttons, they wrap to the next row
# Type can be: "execute" (runs command directly) or "chat" (opens chat with command)

##################################################
# COMMANDES UTILES (1)
##################################################
[[category]]
name = "Commandes utiles"

[[category.buttons]]
label = "Aller au spawn"
command = "/spawn"
type = "execute"

[[category.buttons]]
label = "Définir son home"
command = "/sethome"
type = "execute"

[[category.buttons]]
label = "Retour à son home"
command = "/home"
type = "execute"

[[category.buttons]]
label = "Tous les kits"
command = "/kit"
type = "execute"

##################################################
# COMMANDES UTILES (2)
##################################################
[[category]]
name = "Commandes utiles (2)"

[[category.buttons]]
label = "Téléportation aléatoire"
command = "/rtp"
type = "execute"

[[category.buttons]]
label = "Demande de téléportation"
command = "/tpa joueur"
type = "chat"

[[category.buttons]]
label = "Accepter la téléportation"
command = "/tpaccept"
type = "execute"

[[category.buttons]]
label = "Message privé"
command = "/msg joueur message"
type = "chat"

[[category.buttons]]
label = "Répondre"
command = "/r message"
type = "chat"

[[category.buttons]]
label = "Retour arrière"
command = "/back"
type = "execute"

