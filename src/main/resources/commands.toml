# VaryonUI Commands Configuration
# Max 5 buttons per row, overflow wraps to next row
# Type: "execute" (runs command directly) or "chat" (opens chat with command)

##################################################
# COMMANDES DE TÉLÉPORTATION
##################################################
[[category]]
name = "Commandes de téléportation"

[[category.buttons]]
label = "Aller au spawn"
command = "/spawn"
type = "execute"

[[category.buttons]]
label = "Demande de tp"
command = "/tpa joueur"
type = "chat"

[[category.buttons]]
label = "Accepter la tp"
command = "/tpaccept"
type = "execute"

[[category.buttons]]
label = "Définir son home"
command = "/sethome"
type = "execute"

[[category.buttons]]
label = "Retour à son home"
command = "/home"
type = "execute"

##################################################
# COMMANDES UTILES
##################################################
[[category]]
name = "Commandes utiles"

[[category.buttons]]
label = "Message privé"
command = "/msg joueur message"
type = "chat"

[[category.buttons]]
label = "Répondre"
command = "/r message"
type = "chat"

[[category.buttons]]
label = "Tous les kits"
command = "/kit"
type = "execute"

[[category.buttons]]
label = "Tp lieu de mort"
command = "/back"
type = "execute"

[[category.buttons]]
label = "Tp aléatoire"
command = "/rtp"
type = "execute"

