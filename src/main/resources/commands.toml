[[category.buttons]]
label = "Répondre"
command = "/r message"
type = "chat"

[[category.buttons]]
label = "Tous les kits"
command = "/kit"
type = "execute"

[[category.buttons]]
label = "Tp lieu de mort"
command = "/back"
type = "execute"

[[category.buttons]]
label = "Tp aléatoire"
command = "/rtp"
type = "execute"

[[category.buttons]]
label = "Warp Fraktale"
command = "/warp fraktale"
type = "execute"

[[category.buttons]]
label = "Warp Novale"
command = "/warp novale"
type = "execute"

